name: Deploy staging

# Manual, deliberate deploy to a staging subdomain (e.g. dev.sharp.example.com)
# for exercising the whole path — QR/vanity link -> landing page -> booking ->
# Stripe (test mode) -> webhook -> admin record -> fulfilment -> feedback --
# before anything touches the production domain or live Stripe keys.
#
# Requires (Settings -> Secrets and variables -> Actions):
#   secrets: AWS_DEPLOY_ROLE_ARN          (output of infrastructure/terraform/bootstrap)
#   vars:    AWS_REGION, TF_STATE_BUCKET, STAGING_DOMAIN_NAME
#            STAGING_HOSTED_ZONE_ID (optional), VITE_GA4_MEASUREMENT_ID (optional)
# Uses a "staging" GitHub environment if one exists; create one to gate this
# behind a required reviewer, or leave it unconfigured to skip the gate.

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_STAGE: staging

jobs:
  deploy:
    name: Build, apply, publish (staging)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Build web and API
        run: pnpm build
        env:
          VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infrastructure/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${TF_STAGE}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform apply
        working-directory: infrastructure/terraform
        env:
          TF_VAR_stage: ${{ env.TF_STAGE }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_domain_name: ${{ vars.STAGING_DOMAIN_NAME }}
          TF_VAR_hosted_zone_id: ${{ vars.STAGING_HOSTED_ZONE_ID }}
        run: terraform apply -input=false -auto-approve

      - name: Read outputs
        id: tf
        working-directory: infrastructure/terraform
        run: |
          echo "bucket=$(terraform output -raw site_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "site_url=$(terraform output -raw site_url)" >> "$GITHUB_OUTPUT"
          echo "webhook_url=$(terraform output -raw stripe_webhook_url)" >> "$GITHUB_OUTPUT"

      - name: Publish site
        run: |
          aws s3 sync apps/web/dist "s3://${{ steps.tf.outputs.bucket }}" \
            --delete --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync apps/web/dist "s3://${{ steps.tf.outputs.bucket }}" \
            --exclude "*" --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html; charset=utf-8"
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution }}" \
            --paths "/*" > /dev/null

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "${{ steps.tf.outputs.site_url }}/api/health"; then exit 0; fi
            sleep 10
          done
          echo "API health check failed" && exit 1

      - name: Summary
        run: |
          {
            echo "### Staging deployed"
            echo "- Site: ${{ steps.tf.outputs.site_url }}"
            echo "- Stripe (test mode) webhook URL to register: ${{ steps.tf.outputs.webhook_url }}"
            echo "- See docs/go-live.md for the manual walkthrough (QR -> booking -> Stripe -> confirmation -> admin -> fulfillment -> feedback)."
          } >> "$GITHUB_STEP_SUMMARY"

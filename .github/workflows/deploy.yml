name: Legacy AWS deploy (disabled)

# Historical AWS deployment workflow. The project is moving to Cloudflare.
# Keep this as an explicit no-op until the owner decides whether to remove
# the AWS infrastructure and deployment files permanently.
# No AWS credentials, Terraform apply, or publishing is performed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-deployment-disabled:
    name: AWS deployment intentionally disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment status
        run: |
          echo "AWS deployment is disabled. Frontend deployments are managed through Cloudflare Pages."
          echo "Do not enable this workflow without reviewing the infrastructure architecture."

name: Test

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_PROXY_TARGET: http://127.0.0.1:9
      VITE_API_BASE_URL: /api
      VITE_GA4_MEASUREMENT_ID: ""
      VITE_GA4_MANUAL_EVENTS_ONLY: "false"
      WKC_TEST_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: Disposable D1 persistence and isolated analytics scale regression
        run: pnpm --filter @wkc/api test:database --reporter=default --reporter=junit --outputFile=../../.tmp/database-results.xml

      - run: pnpm build

      - name: Install browser for local UI checks
        run: pnpm --filter @wkc/web exec playwright install --with-deps chromium

      - name: Run mocked browser checks
        run: pnpm --filter @wkc/web test:browser

      - name: Upload synthetic test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/browser-results
            .tmp/database-results.xml
            .tmp/unit-*.xml
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform fmt -recursive -check
        working-directory: infrastructure

      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: infrastructure/terraform

      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: infrastructure/terraform/bootstrap
